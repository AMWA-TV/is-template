name: Documentation push dispatcher
run-name: Push dispatcher - ${{ github.ref_name }}

on:
  push:
    branches:
      - 'v[0-9]+.[0-9]+-dev'
      - 'v[0-9]+.[0-9]+.x'
      - 'publish-*'

permissions:
  contents: read
  actions: write

concurrency:
  group: amwa-documentation-${{ github.repository }}
  cancel-in-progress: false

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Check out pushed commit
        uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - name: Dispatch documentation build
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          commit_subject="$(git log -1 --format=%s)"
          gh workflow run docs.yml \
            --repo "${GITHUB_REPOSITORY}" \
            --ref "${GITHUB_REF_NAME}" \
            -f "ref=${GITHUB_REF_NAME}" \
            -f "run_name=${commit_subject} - ${GITHUB_REF_NAME}"
