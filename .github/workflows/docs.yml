name: Documentation
run-name: ${{ github.event_name == 'push' && 'Push' || github.event_name == 'release' && format('Release - {0}', github.event.release.tag_name) || format('Documentation - {0}', inputs.ref || github.ref_name) }}

on:
  push:
    branches:
      - 'v[0-9]+.[0-9]+-dev'
      - 'v[0-9]+.[0-9]+.x'
      - 'publish-*'
  release:
  workflow_dispatch:
    inputs:
      ref:
        description: Optional branch or tag to rebuild
        required: false
        default: ''


permissions:
  contents: write

concurrency:
  group: amwa-documentation-${{ github.repository }}
  cancel-in-progress: false

jobs:
  docs:
    uses: AMWA-TV/amwa-spec-docs/.github/workflows/docs.yml@main
    with:
      versioned: true
      site-name: is-template
      public-docs-root: https://specs.amwa.tv/new/is-template
      source-ref: ${{ inputs.ref || github.ref_name }}
      # Pin this to a released toolkit tag or commit SHA once available.
      toolkit-ref: main
    secrets: inherit
